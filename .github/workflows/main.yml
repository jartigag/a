name: Build and deploy

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  convert-md-to-html-and-upload-output-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert gtd Markdown to HTML
        uses: ZacJW/markdown-html-action@1.1.0
        with:
          input_files: '[["gtd.md"]]'
          output_files: '["gtd.html"]'
          builtin_stylesheet: 'style.css'
          extensions: '["markdown.extensions.extra"]'

      - name: Convert vps/ Markdown to HTML
        uses: ZacJW/markdown-html-action@1.1.0
        with:
          input_files: '[["vps/*.md"]]'
          output_files: '["vps.html"]'
          builtin_stylesheet: 'style.css'
          extensions: '["markdown.extensions.extra"]'

      - name: Convert mail/ Markdown to HTML
        uses: ZacJW/markdown-html-action@1.1.0
        with:
          input_files: '[["mail/*.md"]]'
          output_files: '["mail.html"]'
          builtin_stylesheet: 'style.css'
          extensions: '["markdown.extensions.extra"]'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate directory listing
        uses: gacts/directory-listing@v1
        with:
          target: .
          footer: true

      - name: Upload index.html artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'index.html'

  deploy:
    needs:
      convert-md-to-html-and-upload-output-files
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
